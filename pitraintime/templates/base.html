{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  {{ form.media.css }}
  <style>
    .django-select2 {
    width: 14em;
  }
  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>PiTrain</title>

  <!-- Bootstrap core CSS -->
  <link href="{% static "bootstrap/css/bootstrap.min.css" %}" rel="stylesheet">

</head>

<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container">
      <a class="navbar-brand" href="#">PiTrain</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link {{ page_train_times }}" href="{% url 'train_times' %}">Train Times
              <span class="sr-only">(current)</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ page_settings }}" href="{% url 'settings' %}">Settings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ page_about }}" href="{% url 'about' %}">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container">
    <div class="row">
      {% block page_content %}{% endblock %}
    </div>
  </div>

  <!-- Footer -->
  <footer class="page-footer font-small dark">

    <!-- Copyright -->
    <div class="footer-copyright text-center py-3">
      © <a href="mailto:nicolas.jourdan@me.com" target="_blank">Nicolas Jourdan</a>
    </div>
    <!-- Copyright -->

  </footer>
  <!-- Footer -->

  <!-- Bootstrap core JavaScript -->
  <script src="//code.jquery.com/jquery-2.1.4.min.js"></script>
  <script src="{% static "bootstrap/js/bootstrap.bundle.min.js" %}"></script>
  {{ form.media.js }}
</body>

</html>
