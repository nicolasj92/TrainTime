{% extends "base.html" %}

{% block page_content %}
<div class="col-lg-12">
    <h1>Settings</h1>
    <form action="" method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-sm-4">
                <h5>Route 1</h5>
                <div class="form-group">
                    <label for="start_station_0">Start Station</label>
                    {{ form.route_0_start_id }}
                </div>
                <div class="form-group">
                    <label for="end_station_0">End Station</label>
                    {{ form.route_0_end_id }}
                </div>
            </div>
            <div class="col-sm-4">
                <h5>Route 2</h5>
                <div class="form-group">
                    <label for="start_station_1">Start Station</label>
                    {{ form.route_1_start_id }}
                </div>
                <div class="form-group">
                    <label for="end_station_1">End Station</label>
                    {{ form.route_1_end_id }}
                </div>
            </div>
        </div>
        <input type="submit" value="Submit" class="btn btn-primary mb-2"/>
    </form>
    {% endblock %}
